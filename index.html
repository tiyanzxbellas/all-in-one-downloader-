<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬇️ All in One Downloader + YouTube Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container {
            max-width: 750px; width: 100%;
            background: rgba(20, 20, 40, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            padding: 30px; box-shadow: 0 30px 50px rgba(0,0,0,0.5);
        }
        h1 {
            color: #fff; font-size: 2.3rem; font-weight: 800; text-align: center; margin-bottom: 5px;
            background: linear-gradient(to right, #f7971e, #ffd200);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .subtitle { color: #b0b0d0; text-align: center; margin-bottom: 25px; font-size: 0.95rem; }
        .input-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .input-wrapper { position: relative; display: flex; flex: 1; }
        input {
            flex: 1; padding: 16px 85px 16px 20px;
            background: rgba(0,0,0,0.3); border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 60px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s; width: 100%;
        }
        input::placeholder { color: #888; }
        input:focus { border-color: #f7971e; background: rgba(0,0,0,0.5); box-shadow: 0 0 0 4px rgba(247,151,30,0.2); }
        button {
            padding: 16px 30px;
            background: linear-gradient(145deg, #f7971e, #ffd200);
            border: none; border-radius: 60px; color: #1a1a2e; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(247,151,30,0.3);
        }
        button:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(247,151,30,0.5); }
        .input-buttons { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 5px; }
        .input-buttons button { padding: 8px 12px; font-size: 0.9rem; box-shadow: none; background: rgba(255,255,255,0.1); color: #fff; border: none; }
        .input-buttons button:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); box-shadow: none; }
        button:disabled { opacity: 0.5; transform: none !important; cursor: not-allowed; box-shadow: none !important; }
        .platform-badge { display: inline-block; padding: 8px 18px; background: rgba(247,151,30,0.15); border-radius: 40px; color: #ffd200; font-size: 0.9rem; font-weight: 600; margin-bottom: 18px; border: 1px solid rgba(247,151,30,0.3); }
        .result-area { margin-top: 25px; }
        .preview-card { background: rgba(0,0,0,0.25); border-radius: 24px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
        .media-title { color: #fff; font-weight: 700; margin-bottom: 15px; font-size: 1rem; word-break: break-word; }
        .thumbnail { width: 100%; max-height: 280px; object-fit: cover; border-radius: 18px; margin-bottom: 20px; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); display: block; }
        .download-links { display: flex; flex-direction: column; gap: 12px; }
        .download-btn { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; background: rgba(247,151,30,0.15); border: 1.5px solid rgba(247,151,30,0.3); border-radius: 60px; color: white; text-decoration: none; font-weight: 600; transition: all 0.25s; }
        .download-btn:hover { background: #f7971e; border-color: #ffd200; color: #1a1a2e; transform: translateY(-2px); }
        .quality-badge { background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; color: #ffd200; white-space: nowrap; }
        .download-btn:hover .quality-badge { background: #1a1a2e; color: #ffd200; }
        .error-message { color: #ff7b7b; text-align: center; padding: 20px; background: rgba(255,80,80,0.1); border-radius: 20px; border: 1px solid rgba(255,80,80,0.2); line-height: 1.6; }
        .loading { text-align: center; color: #ffd200; padding: 35px; font-weight: 500; }
        .loading::after { content: ''; display: inline-block; width: 22px; height: 22px; border: 3px solid #ffd200; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin-left: 12px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-note { text-align: center; margin-top: 25px; color: #7a7a9a; font-size: 0.8rem; }
        .format-label { color: #ffd200; font-size: 0.85rem; margin: 10px 0 5px 5px; font-weight: 600; }
        .yt-mode-switch { display: flex; gap: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 50px; }
        .yt-mode-btn { flex: 1; padding: 12px 20px; border-radius: 50px; border: none; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.3s; background: transparent; color: #aaa; }
        .yt-mode-btn.active-video { background: #ff4444; color: #fff; box-shadow: 0 4px 15px rgba(255,68,68,0.3); }
        .yt-mode-btn.active-audio { background: #1db954; color: #fff; box-shadow: 0 4px 15px rgba(29,185,84,0.3); }
        .yt-mode-btn:hover:not(.active-video):not(.active-audio) { color: #fff; background: rgba(255,255,255,0.1); }
        .retry-btn { background: #1db954; color: white; padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .retry-btn:hover { background: #1ed760; }
        .search-result-item { display: flex; gap: 15px; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .search-result-item:hover { background: rgba(247,151,30,0.2); border-color: #f7971e; transform: translateX(5px); }
        .search-thumb { width: 120px; height: 68px; object-fit: cover; border-radius: 10px; background: #000; flex-shrink: 0; }
        .search-info { flex: 1; min-width: 0; }
        .search-title { color: #fff; font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .search-meta { color: #aaa; font-size: 0.7rem; display: flex; gap: 12px; flex-wrap: wrap; }
        .search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
        .mode-indicator { background: #1db954; color: #fff; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬇️ All in One</h1>
        <div class="subtitle">Download Video & Audio • TikTok • IG • FB • YT • X • Spotify</div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="urlInput" placeholder="Tempel link atau ketik kata kunci untuk mencari di YouTube..." oninput="toggleClearBtn()" />
                <div class="input-buttons">
                    <button id="clearBtn" onclick="clearUrl()" title="Hapus" style="display:none;">✕</button>
                    <button onclick="pasteUrl()" title="Tempel link">📋</button>
                </div>
            </div>
            <button id="downloadBtn" onclick="processInput()">Cari / Download</button>
        </div>

        <div id="result" class="result-area"></div>
        <div class="footer-note">by puruboy-api.vercel.app | 🔍 YouTube Search (Enter)</div>
    </div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────
var currentYoutubeUrl = '';
var searchVideoCache  = [];
var activeAC          = null;   // AbortController aktif
var mp3Loaded         = false;  // flag agar tab MP3 tidak re-fetch tiap klik

// ── FETCH HELPER (timeout + abort) ────────────────────────────────────
function apiFetch(url, body, timeoutMs) {
    if (activeAC) { try { activeAC.abort(); } catch(e){} }
    activeAC = new AbortController();
    var signal = activeAC.signal;
    var t = setTimeout(function(){ activeAC.abort(); }, timeoutMs || 20000);
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: signal
    }).then(function(r){ clearTimeout(t); return r; })
      .catch(function(e){
          clearTimeout(t);
          if (e.name === 'AbortError') throw new Error('Request timeout. Coba lagi.');
          throw e;
      });
}

// ── URL VALIDATOR ──────────────────────────────────────────────────────
function isValidUrl(str) {
    try {
        var u = new URL(str.indexOf('http') === 0 ? str : 'https://' + str);
        return u.hostname.indexOf('.') !== -1;
    } catch(e) { return false; }
}

// ── ESCAPE HTML ────────────────────────────────────────────────────────
function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── FORMAT ANGKA ───────────────────────────────────────────────────────
function fmtNum(n) {
    n = parseInt(n, 10); if (isNaN(n)) return '';
    if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
    if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return String(n);
}

// ── UI HELPERS ─────────────────────────────────────────────────────────
function setLoading(msg) {
    document.getElementById('result').innerHTML = '<div class="loading">'+esc(msg)+'</div>';
    document.getElementById('downloadBtn').disabled = true;
}
function setReady() { document.getElementById('downloadBtn').disabled = false; }
function showError(msg) { document.getElementById('result').innerHTML = '<div class="error-message">❌ '+esc(msg)+'</div>'; }

function toggleClearBtn() {
    var v = document.getElementById('urlInput').value;
    document.getElementById('clearBtn').style.display = v ? 'block' : 'none';
}
function clearUrl() {
    document.getElementById('urlInput').value = '';
    toggleClearBtn();
    document.getElementById('urlInput').focus();
}
async function pasteUrl() {
    try { document.getElementById('urlInput').value = await navigator.clipboard.readText(); toggleClearBtn(); } catch(e){}
}

// ── ENTRY POINT ────────────────────────────────────────────────────────
function processInput() {
    var raw = document.getElementById('urlInput').value.trim();
    if (!raw) { showError('Masukkan URL atau kata kunci YouTube'); return; }
    if (isValidUrl(raw)) {
        processUrl(raw.indexOf('http') === 0 ? raw : 'https://'+raw);
    } else {
        searchYouTube(raw);
    }
}

// ── PLATFORM DETECT ────────────────────────────────────────────────────
function detectPlatform(url) {
    var u = url.toLowerCase();
    if (u.indexOf('tiktok.com') !== -1 || u.indexOf('vm.tiktok') !== -1 || u.indexOf('vt.tiktok') !== -1)
        return { endpoint: 'tiktok-v2', platform: 'TikTok' };
    if (u.indexOf('instagram.com') !== -1 || u.indexOf('instagr.am') !== -1)
        return { endpoint: 'instagram', platform: 'Instagram' };
    if (u.indexOf('facebook.com') !== -1 || u.indexOf('fb.watch') !== -1 || u.indexOf('fb.com') !== -1)
        return { endpoint: 'fbdl', platform: 'Facebook' };
    if (u.indexOf('youtube.com') !== -1 || u.indexOf('youtu.be') !== -1)
        return { endpoint: 'youtube', platform: 'YouTube' };
    if (u.indexOf('x.com') !== -1 || u.indexOf('twitter.com') !== -1)
        return { endpoint: 'x', platform: 'X/Twitter' };
    if (u.indexOf('spotify.com') !== -1)
        return { endpoint: 'spotify', platform: 'Spotify' };
    return { endpoint: null, platform: null };
}

// ── PROCESS URL ────────────────────────────────────────────────────────
async function processUrl(url) {
    var det = detectPlatform(url);
    if (!det.endpoint) { showError('Platform tidak dikenali. Didukung: TikTok, IG, FB, YouTube, X, Spotify.'); return; }
    setLoading('Menghubungi server...');
    mp3Loaded = false;
    try {
        var res = await apiFetch('https://puruboy-api.vercel.app/api/downloader/' + det.endpoint, { url: url });
        if (!res.ok) throw new Error('Server error (' + res.status + ')');
        var data = await res.json();
        if (data.status === false || data.success === false)
            throw new Error(data.message || data.error || data.msg || 'API mengembalikan error');
        if (det.endpoint === 'youtube') {
            currentYoutubeUrl = url;
            renderYoutube(data, det.platform);
        } else {
            renderGeneric(data, det.platform);
        }
    } catch(e) { showError(e.message); }
    finally { setReady(); }
}

// ══════════════════════════════════════════════════════════════════════
// URL EXTRACTOR — handle semua kemungkinan struktur response API
// ══════════════════════════════════════════════════════════════════════

// Field nama yang PASTI berisi download URL (prioritas tinggi)
var DL_FIELDS = [
    'url','download','link','videoUrl','audioUrl','downloadUrl','file','src',
    'hd','sd','low','high','normal','mp4','mp3','m4a','audio','video',
    'source','stream','media','href','uri','play_url','playUrl',
    'download_url','video_url','audio_url','file_url','directUrl','direct_url',
    'quality_url','downloadLink','fileLink','mirror','fallback'
];

// Field yang SKIP (thumbnail / gambar profil)
var SKIP_FIELDS = [
    'thumbnail','thumb','cover','poster','avatar','photo','image','icon',
    'profile_pic','profile_image','channel_image','author_image','picture'
];

function isImageUrl(u) {
    return /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?|$)/i.test(u);
}

function isDownloadUrl(u) {
    return typeof u === 'string' && u.indexOf('http') === 0 && u.length > 15 && u.length < 4000;
}

// Kumpulkan semua URL dengan prioritas field DL_FIELDS terlebih dulu
function extractUrls(obj, bag, depth) {
    if (depth > 12 || obj == null) return;
    if (typeof obj === 'string') {
        if (isDownloadUrl(obj) && !isImageUrl(obj)) bag.push(obj);
        return;
    }
    if (Array.isArray(obj)) {
        for (var i = 0; i < Math.min(obj.length, 80); i++) extractUrls(obj[i], bag, depth + 1);
        return;
    }
    if (typeof obj !== 'object') return;

    var keys = Object.keys(obj).slice(0, 80);
    // Pass 1: field prioritas dulu
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i], kl = k.toLowerCase();
        if (SKIP_FIELDS.indexOf(kl) !== -1) continue;
        if (DL_FIELDS.indexOf(kl) !== -1) {
            var v = obj[k];
            if (typeof v === 'string' && isDownloadUrl(v) && !isImageUrl(v)) {
                bag.push(v);
            } else if (Array.isArray(v)) {
                // array of string atau array of {url, quality, ...}
                for (var j = 0; j < Math.min(v.length, 30); j++) {
                    var item = v[j];
                    if (typeof item === 'string' && isDownloadUrl(item) && !isImageUrl(item)) bag.push(item);
                    else if (item && typeof item === 'object') {
                        var candidate = item.url || item.download || item.link || item.src || item.file || item.href;
                        if (candidate && isDownloadUrl(candidate) && !isImageUrl(candidate)) bag.push(candidate);
                    }
                }
            } else if (v && typeof v === 'object' && !Array.isArray(v)) {
                extractUrls(v, bag, depth + 1);
            }
        }
    }
    // Pass 2: sisa field (rekursif)
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i], kl = k.toLowerCase();
        if (SKIP_FIELDS.indexOf(kl) !== -1) continue;
        if (DL_FIELDS.indexOf(kl) !== -1) continue; // sudah di pass 1
        extractUrls(obj[k], bag, depth + 1);
    }
}

function classifyUrl(u) {
    var ul = u.toLowerCase();
    if (/\.(mp4|webm|mov|avi|mkv|flv|3gp)/.test(ul)) return 'video';
    if (/\.(mp3|m4a|aac|ogg|wav|opus|weba|flac)/.test(ul)) return 'audio';
    if (ul.indexOf('googlevideo') !== -1 || ul.indexOf('videoplayback') !== -1) return 'video';
    if (ul.indexOf('video') !== -1 && ul.indexOf('audio') === -1) return 'video';
    if (ul.indexOf('audio') !== -1 || ul.indexOf('music') !== -1) return 'audio';
    return 'other';
}

// Ambil meta: title, thumbnail, author
function getMeta(data) {
    var r = data.result || data.data || data;
    var title = r.title || r.desc || r.description || r.caption || r.name || '';
    // thumbnail
    var thumb = '';
    var thumbCandidates = [r.thumbnail, r.thumb, r.cover, r.poster, r.image];
    for (var i = 0; i < thumbCandidates.length; i++) {
        var t = thumbCandidates[i];
        if (typeof t === 'string' && t.indexOf('http') === 0) { thumb = t; break; }
        if (t && typeof t === 'object' && t.url && t.url.indexOf('http') === 0) { thumb = t.url; break; }
        if (Array.isArray(t) && t[0]) {
            var ti = typeof t[0] === 'string' ? t[0] : (t[0].url || '');
            if (ti.indexOf('http') === 0) { thumb = ti; break; }
        }
    }
    // author
    var a = r.author || r.uploader || r.username || r.channel || r.creator || '';
    var author = typeof a === 'string' ? a : (a.name || a.username || a.nickname || a.title || '');
    return {
        title: String(title).substring(0, 200),
        thumb: thumb,
        author: String(author).substring(0, 100)
    };
}

// Bangun objek { videos[], audios[], others[] }
function getLinks(data) {
    var r = data.result || data.data || data;
    var bag = [];
    extractUrls(r, bag, 0);
    var seen = {}, unique = [];
    for (var i = 0; i < bag.length; i++) {
        if (!seen[bag[i]]) { seen[bag[i]] = 1; unique.push(bag[i]); }
    }
    var videos = [], audios = [], others = [];
    for (var i = 0; i < unique.length; i++) {
        var c = classifyUrl(unique[i]);
        if (c === 'video') videos.push(unique[i]);
        else if (c === 'audio') audios.push(unique[i]);
        else others.push(unique[i]);
    }
    return { videos: videos.slice(0,8), audios: audios.slice(0,8), others: others.slice(0,5) };
}

// ── RENDER TOMBOL DOWNLOAD ─────────────────────────────────────────────
function buildButtons(links, mode) {
    // mode: 'video' | 'audio' | 'all' | 'ytmp3'
    var html = '<div class="download-links">';
    var hasAny = false;

    // Video
    if (mode !== 'audio' && mode !== 'ytmp3' && links.videos.length) {
        hasAny = true;
        html += '<div class="format-label">🎬 VIDEO</div>';
        links.videos.forEach(function(u, i) {
            var q = 'MP4';
            if (u.indexOf('1080') !== -1) q = '1080p';
            else if (u.indexOf('720') !== -1) q = '720p';
            else if (u.indexOf('480') !== -1) q = '480p';
            else if (u.indexOf('360') !== -1) q = '360p';
            var lbl = links.videos.length > 1 ? '📹 Download Video '+(i+1) : '📹 Download Video';
            html += '<a class="download-btn" href="'+u+'" target="_blank" rel="noopener noreferrer"><span>'+lbl+'</span><span class="quality-badge">'+q+'</span></a>';
        });
    }

    // Audio
    if (mode !== 'video' && links.audios.length) {
        hasAny = true;
        html += '<div class="format-label">🎵 AUDIO</div>';
        links.audios.forEach(function(u, i) {
            var lbl = links.audios.length > 1 ? '🎧 Download Audio '+(i+1) : '🎧 Download Audio';
            html += '<a class="download-btn" href="'+u+'" target="_blank" rel="noopener noreferrer"><span>'+lbl+'</span><span class="quality-badge">MP3</span></a>';
        });
    }

    // Others (misal FB sd/hd yang tidak teklasifikasi sebagai video/audio)
    if (!hasAny && links.others.length) {
        hasAny = true;
        html += '<div class="format-label">⬇️ DOWNLOAD</div>';
        links.others.forEach(function(u, i) {
            html += '<a class="download-btn" href="'+u+'" target="_blank" rel="noopener noreferrer"><span>⬇️ Download '+(i+1)+'</span><span class="quality-badge">FILE</span></a>';
        });
    }

    // Jika semua mode 'video' tapi tidak ada video, fallback ke others
    if (!hasAny && mode === 'video' && links.others.length) {
        html += '<div class="format-label">⬇️ DOWNLOAD</div>';
        links.others.forEach(function(u, i) {
            html += '<a class="download-btn" href="'+u+'" target="_blank" rel="noopener noreferrer"><span>⬇️ Download '+(i+1)+'</span><span class="quality-badge">FILE</span></a>';
        });
        hasAny = true;
    }

    if (!hasAny) html += '<div class="error-message">⚠️ Tidak ada link download ditemukan di response API.</div>';
    html += '</div>';
    return html;
}

// ── RENDER GENERIC (TikTok, IG, FB, X, Spotify) ────────────────────────
function renderGeneric(data, platform) {
    var meta  = getMeta(data);
    var links = getLinks(data);
    var html  = '<div class="preview-card">';
    html += '<span class="platform-badge">📌 '+esc(platform)+'</span>';
    if (meta.title)  html += '<div class="media-title">📝 '+esc(meta.title)+'</div>';
    if (meta.thumb)  html += '<img class="thumbnail" src="'+esc(meta.thumb)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    if (meta.author) html += '<div style="color:#aaa;font-size:0.8rem;margin-bottom:15px;">👤 '+esc(meta.author)+'</div>';
    html += buildButtons(links, 'all');
    html += '</div>';
    document.getElementById('result').innerHTML = html;
}

// ── RENDER YOUTUBE ─────────────────────────────────────────────────────
function renderYoutube(data, platform) {
    var meta  = getMeta(data);
    var links = getLinks(data);
    var html  = '<div class="preview-card">';
    html += '<span class="platform-badge">📌 '+esc(platform)+'</span>';
    if (meta.title)  html += '<div class="media-title">📝 '+esc(meta.title)+'</div>';
    if (meta.thumb)  html += '<img class="thumbnail" src="'+esc(meta.thumb)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    if (meta.author) html += '<div style="color:#aaa;font-size:0.8rem;margin-bottom:15px;">👤 '+esc(meta.author)+'</div>';
    html += '<div class="yt-mode-switch">';
    html += '<button class="yt-mode-btn active-video" id="ytVideoBtn" onclick="switchYt(\'video\')">🎬 Video (MP4)</button>';
    html += '<button class="yt-mode-btn" id="ytAudioBtn" onclick="switchYt(\'audio\')">🎵 Audio (MP3)</button>';
    html += '</div>';
    html += '<div id="ytVideoContent">'+buildButtons(links, 'video')+'</div>';
    html += '<div id="ytAudioContent" style="display:none;"></div>';
    html += '</div>';
    document.getElementById('result').innerHTML = html;
}

function switchYt(mode) {
    var vBtn = document.getElementById('ytVideoBtn');
    var aBtn = document.getElementById('ytAudioBtn');
    var vC   = document.getElementById('ytVideoContent');
    var aC   = document.getElementById('ytAudioContent');
    if (!vBtn || !vC || !aC) return;
    if (mode === 'video') {
        vBtn.className = 'yt-mode-btn active-video'; aBtn.className = 'yt-mode-btn';
        vC.style.display = 'block'; aC.style.display = 'none';
    } else {
        aBtn.className = 'yt-mode-btn active-audio'; vBtn.className = 'yt-mode-btn';
        vC.style.display = 'none'; aC.style.display = 'block';
        if (!mp3Loaded) loadYtMp3();
    }
}

async function loadYtMp3() {
    var aC = document.getElementById('ytAudioContent');
    if (!aC) return;
    mp3Loaded = true;
    aC.innerHTML = '<div class="loading">Mengambil audio MP3...</div>';
    try {
        if (!currentYoutubeUrl) throw new Error('URL YouTube hilang, coba download ulang.');
        var res = await apiFetch('https://puruboy-api.vercel.app/api/downloader/ytmp3', { url: currentYoutubeUrl });
        if (!res.ok) throw new Error('Server error (' + res.status + ')');
        var data = await res.json();
        if (data.status === false || data.success === false)
            throw new Error(data.message || data.error || 'API error');

        var links = getLinks(data);
        // ytmp3 kadang URL-nya masuk 'video' karena tidak ada ekstensi — promosikan ke audio
        if (!links.audios.length && links.videos.length) {
            links.audios = links.videos; links.videos = [];
        }
        if (!links.audios.length && links.others.length) {
            links.audios = links.others; links.others = [];
        }
        aC.innerHTML = buildButtons(links, 'ytmp3');
    } catch(e) {
        mp3Loaded = false; // boleh retry
        aC.innerHTML = '<div class="error-message">❌ '+esc(e.message)+'</div>'
            + '<div style="text-align:center;margin-top:10px"><button class="retry-btn" onclick="loadYtMp3()">🔄 Coba Lagi</button></div>';
    }
}

// ── YOUTUBE SEARCH ─────────────────────────────────────────────────────
async function searchYouTube(query) {
    setLoading('Mencari di YouTube...');
    try {
        var res = await apiFetch('https://api.siputzx.my.id/api/s/youtube', { query: query }, 15000);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();

        var videos = [];
        if (data.status && Array.isArray(data.data))          videos = data.data;
        else if (Array.isArray(data))                          videos = data;
        else if (Array.isArray(data.videos))                   videos = data.videos;
        else if (Array.isArray(data.result))                   videos = data.result;
        else if (Array.isArray(data.items))                    videos = data.items;
        else if (data.data && Array.isArray(data.data.items))  videos = data.data.items;

        if (!videos.length) throw new Error('Tidak ada hasil untuk "' + query + '"');
        searchVideoCache = videos;
        renderSearchResults(videos, query);
    } catch(e) { showError(e.message); }
    finally { setReady(); }
}

function selectVideo(index) {
    var v = searchVideoCache[index];
    if (!v) { showError('Data video tidak ditemukan'); return; }
    var id = v.videoId || v.id || v.video_id || '';
    if (!id) { showError('ID video tidak valid'); return; }
    var url = 'https://www.youtube.com/watch?v=' + id;
    document.getElementById('urlInput').value = url;
    toggleClearBtn();
    processUrl(url);
}

function renderSearchResults(videos, query) {
    var html = '<div class="preview-card">';
    html += '<div class="search-header">';
    html += '<span class="platform-badge">🔍 "'+esc(query.substring(0,40))+'"</span>';
    html += '<span class="mode-indicator">Klik untuk download</span>';
    html += '</div>';

    videos.forEach(function(v, i) {
        var id    = v.videoId || v.id || v.video_id || '';
        var title = esc((v.title || 'No title').substring(0, 100));
        var dur   = v.duration || v.length || '';
        var views = v.views ? fmtNum(v.views) : '';
        var pub   = (v.publishedAt || v.uploadDate || v.published || '').substring(0, 10);
        // thumbnail: string | array of string | array of {url}
        var thumb = '';
        if (typeof v.thumbnail === 'string' && v.thumbnail.indexOf('http') === 0) thumb = v.thumbnail;
        else if (Array.isArray(v.thumbnails) && v.thumbnails[0]) {
            thumb = typeof v.thumbnails[0] === 'string' ? v.thumbnails[0] : (v.thumbnails[0].url || '');
        }
        if (!thumb && id) thumb = 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';

        html += '<div class="search-result-item" onclick="selectVideo('+i+')">';
        html += '<img class="search-thumb" src="'+esc(thumb)+'" alt="" onerror="this.style.display=\'none\'">';
        html += '<div class="search-info">';
        html += '<div class="search-title">'+title+'</div>';
        html += '<div class="search-meta">';
        if (dur)   html += '<span>⏱ '+esc(String(dur))+'</span>';
        if (views) html += '<span>👁 '+esc(views)+'</span>';
        if (pub)   html += '<span>📅 '+esc(pub)+'</span>';
        html += '</div></div></div>';
    });

    html += '<div style="margin-top:15px;text-align:center;">';
    html += '<button class="retry-btn" onclick="resetSearch()" style="background:#555;">← Kembali</button>';
    html += '</div></div>';
    document.getElementById('result').innerHTML = html;
}

function resetSearch() {
    searchVideoCache = [];
    document.getElementById('result').innerHTML = '';
    document.getElementById('urlInput').focus();
}

// ── INIT ───────────────────────────────────────────────────────────────
document.getElementById('urlInput').addEventListener('keypress', function(e){ if (e.key==='Enter') processInput(); });
window.onload = function(){ document.getElementById('urlInput').focus(); toggleClearBtn(); };
</script>
