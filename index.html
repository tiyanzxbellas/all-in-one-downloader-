<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬇️ All in One Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #fff;
            font-size: 2.3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #b0b0d0;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            flex: 1;
        }
        input {
            flex: 1;
            padding: 16px 85px 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        input::placeholder {
            color: #888;
        }
        input:focus {
            border-color: #f7971e;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(247, 151, 30, 0.2);
        }
        button {
            padding: 16px 30px;
            background: linear-gradient(145deg, #f7971e, #ffd200);
            border: none;
            border-radius: 60px;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 15px rgba(247, 151, 30, 0.3);
        }
        button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(247, 151, 30, 0.5);
        }
        .input-buttons {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
        }
        .input-buttons button {
            padding: 8px 12px;
            font-size: 0.9rem;
            box-shadow: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
        }
        .input-buttons button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
            box-shadow: none;
        }
        .clear-btn {
            font-size: 1.2rem !important;
            font-weight: 400 !important;
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }
        .platform-badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(247, 151, 30, 0.15);
            border-radius: 40px;
            color: #ffd200;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 18px;
            border: 1px solid rgba(247, 151, 30, 0.3);
        }
        .result-area {
            margin-top: 25px;
        }
        .preview-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .media-title {
            color: #fff;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1rem;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .thumbnail {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 20px;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .download-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            background: rgba(247, 151, 30, 0.15);
            border: 1.5px solid rgba(247, 151, 30, 0.3);
            border-radius: 60px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s;
        }
        .download-btn:hover {
            background: #f7971e;
            border-color: #ffd200;
            color: #1a1a2e;
            transform: translateY(-2px);
        }
        .quality-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffd200;
        }
        .download-btn:hover .quality-badge {
            background: #1a1a2e;
            color: #ffd200;
        }
        .error-message {
            color: #ff7b7b;
            text-align: center;
            padding: 20px;
            background: rgba(255, 80, 80, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 80, 80, 0.2);
        }
        .loading {
            text-align: center;
            color: #ffd200;
            padding: 35px;
            font-weight: 500;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid #ffd200;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer-note {
            text-align: center;
            margin-top: 25px;
            color: #7a7a9a;
            font-size: 0.8rem;
        }
        .format-label {
            color: #ffd200;
            font-size: 0.85rem;
            margin: 10px 0 5px 5px;
            font-weight: 600;
        }
        details {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        summary {
            color: #ffd200;
            cursor: pointer;
            font-size: 0.8rem;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.7rem;
            color: #0f0;
            margin-top: 8px;
        }
        .yt-mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 50px;
        }
        .yt-mode-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #aaa;
        }
        .yt-mode-btn.active-video {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }
        .yt-mode-btn.active-audio {
            background: #1db954;
            color: #fff;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }
        .yt-mode-btn:hover:not(.active-video):not(.active-audio) {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .warning-message {
            color: #ffd200;
            text-align: center;
            padding: 15px;
            background: rgba(255, 210, 0, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 210, 0, 0.2);
            margin-bottom: 10px;
        }
        .retry-btn {
            background: #1db954;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        .retry-btn:hover {
            background: #1ed760;
        }

        /* === STYLE UNTUK SEARCH === */
        .search-results {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }
        .search-result-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-result-item:hover {
            background: rgba(247, 151, 30, 0.15);
            border-color: rgba(247, 151, 30, 0.3);
            transform: translateY(-2px);
        }
        .search-thumb {
            width: 160px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .search-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .search-title {
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .search-meta {
            color: #aaa;
            font-size: 0.8rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }
        .action-btn {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .action-btn.mp4-btn {
            background: #ff4444;
        }
        .action-btn.mp3-btn {
            background: #1db954;
        }
        .action-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .back-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .search-stats {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬇️ All in One</h1>
        <div class="subtitle">Download Video & Audio • TikTok • IG • FB • YT • X • Spotify • Search YT</div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="urlInput" placeholder="Tempel link atau cari video YouTube..." oninput="toggleClearBtn()" />
                <div class="input-buttons">
                    <button class="clear-btn" id="clearBtn" onclick="clearUrl()" title="Hapus link" style="display: none;">&times;</button>
                    <button class="paste-btn" id="pasteBtn" onclick="pasteUrl()" title="Tempel link">📋</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="downloadBtn" onclick="processUrl()" style="flex: 2;">🔍 Cari / Download</button>
                <button id="searchBtn" onclick="searchYoutube()" style="flex: 1; background: linear-gradient(145deg, #ff4444, #cc0000); color: white;">🎬 Search YT</button>
            </div>
        </div>

        <div id="result" class="result-area"></div>
        <div class="footer-note">by puruboy-api.vercel.app</div>
    </div>

    <script>
        // === VARIABEL GLOBAL ===
        let currentYoutubeUrl = '';
        let youtubeVideoData = null;

        async function processUrl() {
            const urlInput = document.getElementById('urlInput');
            const btn = document.getElementById('downloadBtn');
            const searchBtn = document.getElementById('searchBtn');
            const resultDiv = document.getElementById('result');
            const url = urlInput.value.trim();

            if (!url) {
                resultDiv.innerHTML = '<div class="error-message">❌ Masukkan URL atau kata kunci pencarian</div>';
                return;
            }

            // Deteksi apakah ini URL atau kata kunci
            const { endpoint, platformName } = detectPlatform(url);
            
            if (endpoint) {
                // Ini adalah URL, proses seperti biasa
                btn.disabled = true;
                searchBtn.disabled = true;
                resultDiv.innerHTML = '<div class="loading">Mendeteksi platform & menghubungi server...</div>';

                try {
                    let apiEndpoint = endpoint;
                    if (endpoint === 'tiktok') {
                        apiEndpoint = 'tiktok-v2';
                    }

                    const response = await fetch(`https://puruboy-api.vercel.app/api/downloader/${apiEndpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });

                    if (!response.ok) throw new Error(`Server error (${response.status})`);
                    
                    const data = await response.json();
                    console.log('📦 Data dari API:', data);
                    
                    if (endpoint === 'youtube') {
                        currentYoutubeUrl = url;
                        youtubeVideoData = data;
                        renderYoutubeWithSwitcher(data, platformName);
                    } else {
                        renderResult(data, platformName, apiEndpoint, url);
                    }

                } catch (error) {
                    resultDiv.innerHTML = `<div class="error-message">❌ Error: ${error.message}</div>`;
                } finally {
                    btn.disabled = false;
                    searchBtn.disabled = false;
                }
            } else {
                // Bukan URL, anggap sebagai kata kunci pencarian YouTube
                await searchYoutube();
            }
        }

        async function searchYoutube() {
            const urlInput = document.getElementById('urlInput');
            const btn = document.getElementById('downloadBtn');
            const searchBtn = document.getElementById('searchBtn');
            const resultDiv = document.getElementById('result');
            const query = urlInput.value.trim();

            if (!query) {
                resultDiv.innerHTML = '<div class="error-message">❌ Masukkan kata kunci pencarian</div>';
                return;
            }

            btn.disabled = true;
            searchBtn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">🔍 Mencari video YouTube...</div>';

            try {
                const response = await fetch(`https://api.siputzx.my.id/api/s/youtube?query=${encodeURIComponent(query)}`);
                
                if (!response.ok) throw new Error(`Server error (${response.status})`);
                
                const data = await response.json();
                console.log('📦 Hasil Search:', data);

                if (!data.status || !data.data || data.data.length === 0) {
                    resultDiv.innerHTML = '<div class="error-message">❌ Tidak ada hasil ditemukan</div>';
                    return;
                }

                renderSearchResults(data.data, query);

            } catch (error) {
                resultDiv.innerHTML = `<div class="error-message">❌ Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                searchBtn.disabled = false;
            }
        }

        function renderSearchResults(videos, query) {
            const resultDiv = document.getElementById('result');
            
            let html = `
                <button class="back-btn" onclick="clearSearch()">⬅️ Kembali</button>
                <div class="search-stats">🔍 Ditemukan ${videos.length} video untuk "${query}"</div>
                <div class="search-results">
            `;

            videos.forEach(video => {
                const videoUrl = video.url || `https://youtube.com/watch?v=${video.videoId}`;
                const title = video.title || 'No Title';
                const thumbnail = video.thumbnail || video.thumb || '';
                const duration = video.duration || video.timestamp || '';
                const views = video.views || '';
                const author = video.author || video.channel || '';

                html += `
                    <div class="search-result-item" onclick="event.stopPropagation();">
                        ${thumbnail ? `<img class="search-thumb" src="${thumbnail}" alt="thumb" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <div class="search-info">
                            <div class="search-title">${title}</div>
                            <div class="search-meta">
                                ${author ? `<span>👤 ${author}</span>` : ''}
                                ${duration ? `<span>⏱️ ${duration}</span>` : ''}
                                ${views ? `<span>👁️ ${views}</span>` : ''}
                            </div>
                            <div class="search-actions">
                                <button class="action-btn mp4-btn" onclick="downloadFromSearch('${escapeHtml(videoUrl)}', 'mp4')">
                                    🎬 MP4
                                </button>
                                <button class="action-btn mp3-btn" onclick="downloadFromSearch('${escapeHtml(videoUrl)}', 'mp3')">
                                    🎵 MP3
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultDiv.innerHTML = html;
        }

        async function downloadFromSearch(videoUrl, format) {
            const btn = document.getElementById('downloadBtn');
            const searchBtn = document.getElementById('searchBtn');

            btn.disabled = true;
            searchBtn.disabled = true;

            // Update URL input dengan URL video yang dipilih
            document.getElementById('urlInput').value = videoUrl;
            currentYoutubeUrl = videoUrl;

            if (format === 'mp4') {
                // Gunakan endpoint youtube yang sudah ada (bukan ytmp4)
                await fetchYoutubeVideo(videoUrl);
            } else if (format === 'mp3') {
                // Untuk MP3, tetap coba ytmp3 dulu, kalau gagal pakai youtube biasa
                await fetchYoutubeAudio(videoUrl);
            }

            btn.disabled = false;
            searchBtn.disabled = false;
        }

        async function fetchYoutubeVideo(url) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">🎬 Mengambil video MP4...</div>';

            try {
                // GUNAKAN ENDPOINT YOUTUBE YANG SUDAH ADA (BUKAN ytmp4)
                const response = await fetch('https://puruboy-api.vercel.app/api/downloader/youtube', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) throw new Error(`Server error (${response.status})`);
                
                const data = await response.json();
                console.log('📦 Data YouTube:', data);
                
                currentYoutubeUrl = url;
                youtubeVideoData = data;
                renderYoutubeWithSwitcher(data, 'YouTube');

            } catch (error) {
                resultDiv.innerHTML = `<div class="error-message">❌ Error MP4: ${error.message}
                    <br><button class="retry-btn" onclick="fetchYoutubeVideo('${escapeHtml(url)}')">🔄 Coba Lagi</button>
                    <br><small style="color:#aaa;">Coba gunakan endpoint youtube biasa</small>
                </div>`;
            }
        }

        async function fetchYoutubeAudio(url) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">🎵 Mengambil audio MP3...</div>';

            try {
                // COBA ytmp3 DULU
                let response = await fetch('https://puruboy-api.vercel.app/api/downloader/ytmp3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                // Jika ytmp3 gagal (404), fallback ke youtube biasa
                if (!response.ok) {
                    console.log('⚠️ ytmp3 gagal, fallback ke youtube...');
                    response = await fetch('https://puruboy-api.vercel.app/api/downloader/youtube', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });
                    
                    if (!response.ok) throw new Error(`Server error (${response.status})`);
                    
                    const data = await response.json();
                    console.log('📦 Data YouTube (fallback):', data);
                    
                    // Coba ekstrak audio dari data youtube
                    let result = data.result || data.data || data;
                    let audioUrl = null;
                    
                    // Cari URL audio dalam formats
                    if (result.formats) {
                        const audioFormat = result.formats.find(f => 
                            f.mimeType?.includes('audio') || 
                            f.quality?.includes('audio') ||
                            f.type?.includes('audio')
                        );
                        if (audioFormat?.url) audioUrl = audioFormat.url;
                    }
                    
                    // Cari di semua URL
                    if (!audioUrl) {
                        const allUrls = findAllUrlsAggressive(result);
                        const audioUrls = allUrls.filter(u => 
                            u.includes('audio') || 
                            u.match(/\.(mp3|m4a|aac|ogg)/i)
                        );
                        if (audioUrls.length > 0) audioUrl = audioUrls[0];
                    }
                    
                    if (!audioUrl) {
                        throw new Error('Tidak dapat menemukan URL audio. Coba download video MP4 saja.');
                    }
                    
                    // Buat data dummy dengan URL audio
                    data.result = { ...result, audioUrl: audioUrl };
                    
                    currentYoutubeUrl = url;
                    youtubeVideoData = data;
                    renderYoutubeWithSwitcher(data, 'YouTube');
                    
                    // Auto switch ke audio mode
                    setTimeout(() => {
                        const audioBtn = document.getElementById('ytAudioBtn');
                        if (audioBtn) audioBtn.click();
                    }, 100);
                    
                    return;
                }
                
                const data = await response.json();
                console.log('📦 Data ytmp3:', data);
                
                currentYoutubeUrl = url;
                youtubeVideoData = data;
                renderYoutubeWithSwitcher(data, 'YouTube');
                
                // Auto switch ke audio mode
                setTimeout(() => {
                    const audioBtn = document.getElementById('ytAudioBtn');
                    if (audioBtn) audioBtn.click();
                }, 100);

            } catch (error) {
                resultDiv.innerHTML = `<div class="error-message">❌ Error MP3: ${error.message}
                    <br><button class="retry-btn" onclick="fetchYoutubeAudio('${escapeHtml(url)}')">🔄 Coba Lagi</button>
                    <br><button class="retry-btn" onclick="fetchYoutubeVideo('${escapeHtml(url)}')" style="background:#ff4444;">🎬 Download MP4 Saja</button>
                </div>`;
            }
        }

        function detectPlatform(url) {
            const u = url.toLowerCase();
            if (u.includes('tiktok.com') || u.includes('vm.tiktok') || u.includes('vt.tiktok') || (u.includes('tiktok') && u.includes('/video/'))) 
                return { endpoint: 'tiktok', platformName: 'TikTok' };
            if (u.includes('instagram.com') || u.includes('instagr.am')) 
                return { endpoint: 'instagram', platformName: 'Instagram' };
            if (u.includes('facebook.com') || u.includes('fb.watch') || u.includes('fb.com')) 
                return { endpoint: 'fbdl', platformName: 'Facebook' };
            if (u.includes('youtube.com') || u.includes('youtu.be')) 
                return { endpoint: 'youtube', platformName: 'YouTube' };
            if (u.includes('x.com') || u.includes('twitter.com')) 
                return { endpoint: 'x', platformName: 'X/Twitter' };
            if (u.includes('spotify.com')) 
                return { endpoint: 'spotify', platformName: 'Spotify' };
            return { endpoint: null, platformName: null };
        }

        function renderYoutubeWithSwitcher(data, platformName) {
            const resultDiv = document.getElementById('result');
            
            let result = data.result || data.data || data;
            
            let html = `<div class="preview-card">`;
            html += `<span class="platform-badge">📌 ${platformName}</span>`;
            
            let title = result.title || result.desc || result.description || '';
            if (title && typeof title === 'string' && title.length < 300) {
                html += `<div class="media-title">📝 ${title.substring(0, 200)}</div>`;
            }
            
            let thumbnail = result.thumbnail || result.thumb || result.cover || '';
            if (thumbnail && typeof thumbnail === 'string' && thumbnail.startsWith('http')) {
                html += `<img class="thumbnail" src="${thumbnail}" alt="thumbnail" loading="lazy" onerror="this.style.display='none'">`;
            }
            
            let author = result.author || result.username || result.owner || result.creator;
            if (author) {
                if (typeof author === 'string') {
                    html += `<div style="color: #aaa; font-size: 0.8rem; margin-bottom: 15px;">👤 ${author}</div>`;
                } else if (author.username || author.nickname) {
                    html += `<div style="color: #aaa; font-size: 0.8rem; margin-bottom: 15px;">👤 ${author.username || author.nickname}</div>`;
                }
            }
            
            html += `<div class="yt-mode-switch">
                <button class="yt-mode-btn active-video" id="ytVideoBtn" onclick="switchToYtVideo()">🎬 Video (MP4)</button>
                <button class="yt-mode-btn" id="ytAudioBtn" onclick="switchToYtMp3()">🎵 Audio (MP3)</button>
            </div>`;
            
            html += `<div id="ytVideoContent">`;
            html += renderDownloadLinks(result, 'video');
            html += `</div>`;
            
            html += `<div id="ytAudioContent" style="display:none;">`;
            // Pre-render audio content
            html += renderDownloadLinks(result, 'audio');
            html += `</div>`;
            
            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        function renderDownloadLinks(result, type) {
            let html = `<div class="download-links">`;
            
            if (type === 'video') {
                let allUrls = findAllUrls(result);
                let videoUrls = allUrls.filter(u => 
                    u.match(/\.(mp4|webm|mov|avi|mkv)/i) || 
                    u.includes('video') || 
                    (u.includes('?') && !u.includes('audio'))
                );
                
                let formats = result.formats || result.video || [];
                if (Array.isArray(formats)) {
                    formats.forEach(fmt => {
                        if (fmt.url && !videoUrls.includes(fmt.url)) {
                            videoUrls.push(fmt.url);
                        }
                    });
                }
                
                if (result.url || result.download || result.link || result.videoUrl) {
                    let directUrl = result.url || result.download || result.link || result.videoUrl;
                    if (typeof directUrl === 'string' && !videoUrls.includes(directUrl)) {
                        videoUrls.push(directUrl);
                    }
                }
                
                videoUrls = [...new Set(videoUrls)];
                
                if (videoUrls.length > 0) {
                    html += `<div class="format-label">🎬 VIDEO</div>`;
                    videoUrls.forEach((url, idx) => {
                        let label = '📹 Download Video';
                        if (videoUrls.length > 1) label += ` ${idx+1}`;
                        html += `<a class="download-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                            <span>${label}</span>
                            <span class="quality-badge">MP4</span>
                        </a>`;
                    });
                } else {
                    html += `<div class="error-message">⚠️ Tidak ada link video ditemukan.</div>`;
                }
            } else if (type === 'audio') {
                let allUrls = findAllUrlsAggressive(result);
                
                let audioUrls = allUrls.filter(u => 
                    u.match(/\.(mp3|m4a|aac|ogg|wav|mpeg|opus|weba)/i) || 
                    u.includes('audio') || 
                    u.includes('music') ||
                    u.includes('sound')
                );
                
                if (audioUrls.length === 0) {
                    audioUrls = allUrls.filter(u => 
                        u.includes('download') || 
                        u.includes('file') ||
                        u.includes('stream')
                    );
                }
                
                // Cek juga audioUrl langsung
                if (result.audioUrl && typeof result.audioUrl === 'string') {
                    audioUrls.push(result.audioUrl);
                }
                
                audioUrls = [...new Set(audioUrls)];
                
                if (audioUrls.length > 0) {
                    html += `<div class="format-label">🎵 AUDIO MP3</div>`;
                    audioUrls.forEach((url, idx) => {
                        let label = '🎧 Download MP3';
                        if (audioUrls.length > 1) label += ` ${idx+1}`;
                        html += `<a class="download-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                            <span>${label}</span>
                            <span class="quality-badge">MP3</span>
                        </a>`;
                    });
                } else {
                    html += `<div class="warning-message">⚠️ Tidak ada link audio ditemukan. Coba refresh halaman.</div>`;
                }
            }
            
            html += `</div>`;
            return html;
        }

        function findAllUrlsAggressive(obj, urls = []) {
            if (!obj) return urls;
            
            if (typeof obj === 'string') {
                if (obj.startsWith('http') && obj.length > 10) {
                    urls.push(obj);
                }
            } 
            else if (Array.isArray(obj)) {
                obj.forEach(item => findAllUrlsAggressive(item, urls));
            } 
            else if (typeof obj === 'object') {
                for (let key in obj) {
                    findAllUrlsAggressive(obj[key], urls);
                }
            }
            
            return [...new Map(urls.map(u => [u, u])).values()];
        }

        function findAllUrls(obj, urls = []) {
            if (!obj) return urls;
            
            if (typeof obj === 'string') {
                if (obj.startsWith('http') && 
                    (obj.includes('.mp4') || obj.includes('.mp3') || 
                     obj.includes('video') || obj.includes('download') || 
                     obj.includes('media') || obj.includes('blob:') || 
                     obj.includes('?') || obj.match(/\.(mp4|mp3|m4a|webm|mov)/i))) {
                    urls.push(obj);
                }
            } 
            else if (Array.isArray(obj)) {
                obj.forEach(item => findAllUrls(item, urls));
            } 
            else if (typeof obj === 'object') {
                const skipKeys = ['thumbnail', 'thumb', 'cover', 'avatar', 'profile_pic', 'image', 'icon'];
                for (let key in obj) {
                    if (skipKeys.includes(key)) continue;
                    findAllUrls(obj[key], urls);
                }
            }
            
            return [...new Map(urls.map(u => [u, u])).values()];
        }

        function switchToYtVideo() {
            const videoBtn = document.getElementById('ytVideoBtn');
            const audioBtn = document.getElementById('ytAudioBtn');
            const videoContent = document.getElementById('ytVideoContent');
            const audioContent = document.getElementById('ytAudioContent');
            
            if (videoBtn) videoBtn.className = 'yt-mode-btn active-video';
            if (audioBtn) audioBtn.className = 'yt-mode-btn';
            if (videoContent) videoContent.style.display = 'block';
            if (audioContent) audioContent.style.display = 'none';
        }

        function switchToYtMp3() {
            const videoBtn = document.getElementById('ytVideoBtn');
            const audioBtn = document.getElementById('ytAudioBtn');
            const videoContent = document.getElementById('ytVideoContent');
            const audioContent = document.getElementById('ytAudioContent');
            
            if (videoBtn) videoBtn.className = 'yt-mode-btn';
            if (audioBtn) audioBtn.className = 'yt-mode-btn active-audio';
            if (videoContent) videoContent.style.display = 'none';
            if (audioContent) audioContent.style.display = 'block';
        }

        function renderResult(data, platformName, endpoint, originalUrl) {
            const resultDiv = document.getElementById('result');
            
            if (data.status === false || data.error) {
                resultDiv.innerHTML = `<div class="error-message">❌ Gagal: ${data.message || data.error || 'Konten tidak tersedia'}</div>`;
                return;
            }

            let result = data.result || data.data || data;
            
            let videoArray = result.video || (result.medias && result.medias.filter(m => m.type === 'video')) || [];
            let audioArray = result.audio || result.music || (result.medias && result.medias.filter(m => m.type === 'audio')) || [];
            
            let allDownloadUrls = findAllUrls(result);
            
            if (Array.isArray(videoArray)) {
                videoArray.forEach(v => {
                    if (v.url) allDownloadUrls.push(v.url);
                });
            }
            if (Array.isArray(audioArray)) {
                audioArray.forEach(a => {
                    if (a.url) allDownloadUrls.push(a.url);
                });
            }
            if (result.videoUrl) allDownloadUrls.push(result.videoUrl);
            if (result.audioUrl) allDownloadUrls.push(result.audioUrl);
            if (result.download) allDownloadUrls.push(result.download);
            if (result.link) allDownloadUrls.push(result.link);
            
            allDownloadUrls = [...new Set(allDownloadUrls.filter(url => 
                url && typeof url === 'string' && url.startsWith('http') && url.length > 10
            ))];
            
            let html = `<div class="preview-card">`;
            html += `<span class="platform-badge">📌 ${platformName}</span>`;
            
            let title = result.title || result.desc || result.description || result.caption || result.text || '';
            if (title && typeof title === 'string' && title.length < 300) {
                html += `<div class="media-title">📝 ${title.substring(0, 200)}</div>`;
            }
            
            let thumbnail = result.thumbnail || result.thumb || result.cover || result.origin_cover || result.image;
            if (thumbnail && typeof thumbnail === 'string' && thumbnail.startsWith('http')) {
                html += `<img class="thumbnail" src="${thumbnail}" alt="thumbnail" loading="lazy" onerror="this.style.display='none'">`;
            }
            
            let author = result.author || result.username || result.owner || result.creator;
            if (author) {
                if (typeof author === 'string') {
                    html += `<div style="color: #aaa; font-size: 0.8rem; margin-bottom: 15px;">👤 ${author}</div>`;
                } else if (author.username || author.nickname) {
                    html += `<div style="color: #aaa; font-size: 0.8rem; margin-bottom: 15px;">👤 ${author.username || author.nickname}</div>`;
                }
            }
            
            html += `<div class="download-links">`;
            
            if (allDownloadUrls.length === 0) {
                html += `<div class="error-message">⚠️ Tidak ada link download ditemukan.</div>`;
                html += `<details><summary>🔍 Lihat data mentah</summary><pre>${JSON.stringify(result, null, 2)}</pre></details>`;
            } else {
                const videoUrls = allDownloadUrls.filter(u => 
                    u.match(/\.(mp4|webm|mov|avi|mkv)/i) || 
                    u.includes('video') || 
                    (u.includes('?') && !u.includes('audio'))
                );
                const audioUrls = allDownloadUrls.filter(u => 
                    u.match(/\.(mp3|m4a|aac|ogg|wav|mpeg)/i) || 
                    u.includes('audio') || 
                    u.includes('music')
                );
                
                if (videoUrls.length > 0) {
                    html += `<div class="format-label">🎬 VIDEO</div>`;
                    videoUrls.forEach((url, idx) => {
                        let label = '📹 Download Video';
                        if (videoUrls.length > 1) label += ` ${idx+1}`;
                        html += `<a class="download-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                            <span>${label}</span>
                            <span class="quality-badge">MP4</span>
                        </a>`;
                    });
                }
                
                if (audioUrls.length > 0) {
                    html += `<div class="format-label">🎵 AUDIO / MUSIC</div>`;
                    audioUrls.forEach((url, idx) => {
                        let label = '🎧 Download Audio';
                        if (audioUrls.length > 1) label += ` ${idx+1}`;
                        html += `<a class="download-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                            <span>${label}</span>
                            <span class="quality-badge">MP3</span>
                        </a>`;
                    });
                }
                
                const otherUrls = allDownloadUrls.filter(u => !videoUrls.includes(u) && !audioUrls.includes(u));
                if (otherUrls.length > 0 && videoUrls.length === 0 && audioUrls.length === 0) {
                    html += `<div class="format-label">⬇️ LINK DOWNLOAD</div>`;
                    otherUrls.forEach((url, idx) => {
                        html += `<a class="download-btn" href="${url}" target="_blank" rel="noopener noreferrer">
                            <span>📎 Download Link ${idx+1}</span>
                            <span class="quality-badge">FILE</span>
                        </a>`;
                    });
                }
            }
            
            html += `</div></div>`;
            resultDiv.innerHTML = html;
        }

        function clearSearch() {
            document.getElementById('result').innerHTML = '';
            document.getElementById('urlInput').value = '';
            document.getElementById('urlInput').focus();
            toggleClearBtn();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function toggleClearBtn() {
            const urlInput = document.getElementById('urlInput');
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.style.display = urlInput.value.length > 0 ? 'block' : 'none';
        }

        function clearUrl() {
            const urlInput = document.getElementById('urlInput');
            urlInput.value = '';
            toggleClearBtn();
            urlInput.focus();
        }

        async function pasteUrl() {
            try {
                const text = await navigator.clipboard.readText();
                const urlInput = document.getElementById('urlInput');
                urlInput.value = text;
                toggleClearBtn();
                urlInput.focus();
            } catch (err) {
                console.error('Gagal menempel link: ', err);
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', e => { 
            if (e.key === 'Enter') processUrl(); 
        });
        
        window.onload = () => {
            document.getElementById('urlInput').focus();
            toggleClearBtn();
        };
    </script>
</body>
